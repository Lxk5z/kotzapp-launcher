<!DOCTYPE html>
<html lang="de">
<head>

    <script>
  window.CDN_BASE = "https://cdn.jsdelivr.net/gh/Lxk5z/kotzapp-web@latest";
    </script>

  <link rel="icon" href="" id="favicon">
  <link rel="icon" type="image/png" sizes="32x32" href="" id="favicon32">
  <link rel="apple-touch-icon" href="" id="appleicon">
  <link rel="manifest" href="/manifest.json">

  <link rel="stylesheet" href="" id="fontcss">
  <link rel="stylesheet" href="" id="messengercss">
  <link rel="stylesheet" href="" id="stylecss">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KotzApp Messenger</title>


     <script type="application/
 ld+json">
 {
   "@context": "https://
 schema.org",
   "@type":  
 "DiscussionForum",
   "name": "KotzApp",
   "url": "https://
 kotzapp.vercel.app",
   "genre": ["Kommunikation",  
 "Bildung", "Spiele", 
 "Unterhaltung"],
   "description": "Chat-
 Plattform für Bildung, Spiele 
 und Unterhaltung"
}
</script>

</head>
<body>
  <div id="page-transition-overlay"></div>

  <script>
      // ======= START CODE =======
      const scriptMain = document.createElement("script");
      scriptMain.src = CDN_BASE + "/main.js";
      document.body.appendChild(scriptMain);
    </script>

    <script>
      // ======= ONLINE PING =======
      const scriptOnlinePing = document.createElement("script");
      scriptOnlinePing.src = CDN_BASE + "/online-ping.js";
      document.body.appendChild(scriptOnlinePing);
    </script>
    



    <div class="chat-bg"></div>
    <div class="black-bg-filter" style="width:100%; height:100%; background-color:rgba(0, 0, 0, 0.348);"></div>




  <!-- HEADER BEREICH -->
  <div class="header">
    <div class="header-particles"></div>
    <div class="header-content">

      <!-- NEUER KLICK-BEREICH -->
      <div class="click-area">

        <div class="left-block">
          <img class="profile-image" src="" id="profileImage" alt="Profilbild">

          <div class="user-info">
            <h1 class="username">Lade...</h1>
            <p class="info-description"></p>
          </div>
        </div>

        <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
          <path d="M440-280h80v-240h-80v240Zm68.5-331.5Q520-623 520-640t-11.5-28.5Q497-680 480-680t-28.5 11.5Q440-657 440-640t11.5 28.5Q463-600 480-600t28.5-11.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/>
        </svg> 

      </div>
  </div>
</div>

<!-- THEME DROPDOWN -->
<div id="theme-dropdown" class="theme-dropdown">
  <div class="theme-dropdown-content">
    <div class="theme-row">
      <div id="theme-color-preview" class="theme-preview-square"></div>
      <span class="theme-label">Akzent Farbe</span>
      <button id="edit-theme-btn" class="theme-edit-btn" aria-label="Farbe ändern">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/></svg>
      </button>
      <input type="color" id="theme-color-input" style="opacity: 0; position: absolute; pointer-events: none; width: 0; height: 0;">
    </div>
    <div class="theme-row">
      <div id="text-color-preview" class="theme-preview-square"></div>
      <span class="theme-label">Schriftfarbe</span>
      <button id="edit-text-btn" class="theme-edit-btn" aria-label="Farbe ändern">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/></svg>
      </button>
      <input type="color" id="text-color-input" style="opacity: 0; position: absolute; pointer-events: none; width: 0; height: 0;">
    </div>
  </div>
</div>

<div id="floating-date-badge" class="floating-date-badge hidden"></div>

<!-- CHAT INHALT -->
<div class="chat-content">
    </div>


<!-- RUNTER SCROLLEN -->
 <button id="scrollToBottomBtn" class="scroll-bottom-btn" aria-label="Nach unten scrollen">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
    <path d="M480-345 240-585l56-56 184 184 184-184 56 56-240 240Z"/>
  </svg>
</button>

<!-- TASTATUR BEREICH -->
<div class="input-content">
  <div id="not-available-notice" class="not-available-notice">Dieses Feature ist leider noch nicht verfügbar :(</div>
  <svg class="add-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>

  <div class="tastatur-field">
    <!-- Pill input -->
    <div class="input-pill" id="inputPill">
      <div id="inputHighlighter" class="input-highlighter"></div>
      <textarea id="messageInput" rows="1" placeholder="Nachricht schreiben..." autocomplete="off"></textarea>
      <button id="stickerBtn" class="icon-btn sticker-btn" aria-label="Sticker">
        <svg class="sticker-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M460-360q69 0 120-45t60-113l-320 90q26 32 62 50t78 18ZM294-510l106-30q4-28-14-49t-46-21q-25 0-42.5 17.5T280-550q0 11 4 21t10 19Zm240-70 106-30q5-28-13.5-49T580-680q-25 0-42.5 17.5T520-620q0 11 4 21t10 19Zm106 460H200q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v440L640-120Zm-40-80v-80q0-33 23.5-56.5T680-360h80v-400H200v560h400Zm0 0Zm-400 0v-560 560Z"/></svg>
      </button>
    </div>
  </div>

  <svg class="camera-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-260q75 0 127.5-52.5T660-440q0-75-52.5-127.5T480-620q-75 0-127.5 52.5T300-440q0 75 52.5 127.5T480-260Zm0-80q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29ZM160-120q-33 0-56.5-23.5T80-200v-480q0-33 23.5-56.5T160-760h126l74-80h240l74 80h126q33 0 56.5 23.5T880-680v480q0 33-23.5 56.5T800-120H160Zm0-80h640v-480H638l-73-80H395l-73 80H160v480Zm320-240Z"/></svg>

  <!-- Mic / Send button (JS toggled) -->
  <button id="micSendBtn" class="mic-send-btn" aria-label="Senden / Mikrofon">
  <!-- Mic Icon -->
  <svg class="mic-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
    <path d="M395-435q-35-35-35-85v-240q0-50 35-85t85-35q50 0 85 35t35 85v240q0 50-35 85t-85 35q-50 0-85-35Zm85-205Zm-40 520v-123q-104-14-172-93t-68-184h80q0 83 58.5 141.5T480-320q83 0 141.5-58.5T680-520h80q0 105-68 184t-172 93v123h-80Zm68.5-371.5Q520-503 520-520v-240q0-17-11.5-28.5T480-800q-17 0-28.5 11.5T440-760v240q0 17 11.5 28.5T480-480q17 0 28.5-11.5Z"/>
  </svg>

  <!-- Send Icon -->
  <svg class="send-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 535.5 535.5">
    <g id="send">
      <polygon points="0,497.25 535.5,267.75 0,38.25 0,216.75 382.5,267.75 0,318.75"/>
    </g>
  </svg>
</button>
</div>


  <script>
    // ====== ALLE LINKS HIER ======

    document.getElementById("favicon").href = CDN_BASE + "/favicon.ico";

    document.getElementById("fontcss").href = CDN_BASE + "/fonts/aclonica.css";

  <script>
  const script3 = document.createElement("script");
  script3.src = CDN_BASE + "/messenger.js";
  document.body.appendChild(script3);

        @import url('https://fonts.googleapis.com/css2?family=Jersey+10&display=swap');
