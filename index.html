  <style>
    img {
      border-radius: 15px;
      width: clamp(200px, 70vw, 300px); /* Standardbreite */ 
      height: auto; /* Seitenverhältnis bleibt */ 
      max-height: 80vh; /* Wenn Bildschirm zu niedrig → automatisch kleiner */ 
      object-fit: contain; /* Bild niemals verzerren */ 
      display: block;
      box-shadow: #ffffff34 10px 10px 0px;
    }

    /* =========================================
   Splash Screen
========================================= */
#splash {
  position: fixed;
  inset: 0;
  background: #0f0f0f;
  color: #333;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 20px;
  z-index: 99999;
}

#splash img {
  filter: brightness(0.85);
}

#splash-text {
  font-size: 18px;
  color: white;
}

#splash-icon {
  width: min(160px, 40vw);
  height: auto;
  border-radius: 20%;
}

/* Loader */
.loader {
  border: 6px solid #484848;
  border-top: 6px solid #00C853;
  border-radius: 50%;
  width: 45px;
  height: 45px;
  animation: spin 1.0s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loading-text {
  color: white;
  font-size: 16px;
  font-weight: 500;
  font-family: 'Aclonica', sans-serif;
}
  </style>

  <script>
    // UUID generieren für device_id falls nicht vorhanden
function generateUUID() {
  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
  );
}

(function ensureDeviceId() {
  let id = localStorage.getItem("device_id");
  if (!id) {
    id = generateUUID();
    localStorage.setItem("device_id", id);
    console.log("🔑 Neue device_id erzeugt:", id);
  } else {
    console.log("📱 device_id vorhanden:", id);
  }
})();

// Überprüfe currently_account im localStorage
function resolveCurrentUserId() {
  const raw = localStorage.getItem('currently_account');

  if (!raw) {
    console.error("KotzApp: Kein currently_account im localStorage gefunden.");
    throw new Error("No logged-in account");
  }

  const id = String(raw).trim();

  // Formatprüfung (U01, U18, etc.)
  if (!/^U\d{2,}$/.test(id)) {
    console.error("KotzApp: Ungültige User-ID:", id);
    try {
  window.CURRENT_USER_ID = resolveCurrentUserId();
} catch (err) {
  console.warn("Kein Account → redirect zum Login");
  window.navigateTo("/login.html");
}
  }

  return id;
}
</script>
